name: Production Release

on:
  push:
    branches:
      - main

jobs:
  production-release:
    name: Production Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get Current Version
        id: current-version
        run: |
          # 获取当前版本号
          CURRENT_VERSION=$(npx lerna list --json | jq -r '.[0].version')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # 解析版本号，移除 beta 后缀
          if [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            SUFFIX="${BASH_REMATCH[4]}"

            # 移除 beta 后缀，进行中版本升级
            if [[ $SUFFIX =~ -beta\.[0-9]+$ ]]; then
              # 从 beta 版本升级，增加 minor 版本号
              NEW_MINOR=$(($MINOR + 1))
              NEW_VERSION="$MAJOR.$NEW_MINOR.0"
            else
              # 正常版本升级，增加 minor 版本号
              NEW_MINOR=$(($MINOR + 1))
              NEW_VERSION="$MAJOR.$NEW_MINOR.0"
            fi
          else
            # 如果无法解析，使用默认版本
            NEW_VERSION="1.0.0"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update Package Versions
        run: |
          # 使用 lerna 更新版本号
          npx lerna version ${{ steps.current-version.outputs.new_version }} --no-git-tag-version --yes

          # 提交版本更新
          git add .
          git commit -m "chore: release version ${{ steps.current-version.outputs.new_version }} [skip ci]"

      - name: Publish Production Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 发布正式版本到 npm (latest tag)
          npx lerna publish from-package --dist-tag latest --yes

      - name: Create Git Tag
        run: |
          # 创建 git tag
          git tag -a "v${{ steps.current-version.outputs.new_version }}" -m "Release ${{ steps.current-version.outputs.new_version }}"
          git push origin "v${{ steps.current-version.outputs.new_version }}"

      - name: Push Changes
        run: |
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.current-version.outputs.new_version }}
          release_name: Release ${{ steps.current-version.outputs.new_version }}
          body: |
            ## 🎉 Production Release

            Version: ${{ steps.current-version.outputs.new_version }}

            ### Changes
            - Production release from main branch
            - Updated from beta version to stable release

            ### Installation
            ```bash
            npm install @your-org/package-name@latest
            ```
          draft: false
          prerelease: false